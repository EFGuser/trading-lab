name: Intraday Paper Trading Monitor
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'intraday_research.py'
      - 'site/intraday.html'
      - '.github/workflows/intraday-paper.yml'
  schedule:
    - cron: '8,23,38,53 13-22 * * 1-5'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: trading-lab-updates
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify paper-trading engine
        run: |
          python -m py_compile intraday_research.py
          python intraday_research.py --self-test
      - name: Install data client
        run: pip install -r requirements.txt
      - name: Fetch most recent completed intraday bars and paper trade
        run: python intraday_research.py
      - name: Persist intraday audit, account and published snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data site/data
          if ! git diff --cached --quiet; then
            git commit -m "Save observed intraday paper trades [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deploy
